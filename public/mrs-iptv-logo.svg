<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="M R S IPTV logo">
  <title>M R S IPTV logo</title>
  <defs>
    <linearGradient id="mrsBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#176BFF" />
      <stop offset="100%" stop-color="#B832F5" />
    </linearGradient>
    <linearGradient id="mrsWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="52%" stop-color="#176BFF" />
      <stop offset="100%" stop-color="#B832F5" />
    </linearGradient>
    <linearGradient id="mrsSilverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C9D1E0" />
    </linearGradient>
  </defs>

  <!-- Midnight Background Plate -->
  <rect width="640" height="200" rx="16" fill="#050816" />

  <!-- Television + Play Button + Broadcast Signal Symbol -->
  <g transform="translate(36, 34)">
    <!-- Outer Stylized TV Frame -->
    <rect x="0" y="10" width="132" height="94" rx="16" fill="#050816" stroke="url(#mrsSilverGrad)" stroke-width="6" />
    <!-- Inner Gradient Broadcast Screen Border -->
    <rect x="10" y="20" width="112" height="74" rx="10" fill="#050816" stroke="url(#mrsBrandGrad)" stroke-width="3.5" />

    <!-- Bold Integrated Play Button Symbol -->
    <path d="M50 35.5 C50 32.5 53.3 30.7 55.9 32.2 L91.5 53.2 C94.1 54.7 94.1 58.5 91.5 60.0 L55.9 81.0 C53.3 82.5 50 80.7 50 77.7 Z" fill="url(#mrsBrandGrad)" />
    <path d="M57 44 L79 56.6 L57 69.2 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- TV Pedestal Stand -->
    <path d="M42 116 L90 116" stroke="#C9D1E0" stroke-width="6" stroke-linecap="round" />
    <path d="M56 104 L52 116 M76 104 L80 116" stroke="#C9D1E0" stroke-width="4.5" stroke-linecap="round" />

    <!-- Subtle Broadcast Signal Waves (Top-Right Connectivity) -->
    <path d="M142 36 A 24 24 0 0 1 142 78" fill="none" stroke="#00D9FF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M153 26 A 38 38 0 0 1 153 88" fill="none" stroke="url(#mrsBrandGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Brand Wordmark: M R S IPTV -->
  <g transform="translate(222, 0)">
    <text x="0" y="108" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" letter-spacing="3">
      <tspan fill="#FFFFFF">M R S </tspan>
      <tspan fill="url(#mrsWordGrad)">IPTV</tspan>
    </text>
    <!-- Optional Tagline -->
    <text x="4" y="142" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4.5" fill="#C9D1E0">
      YOUR WORLD &#8226; YOUR CHANNELS
    </text>
  </g>
</svg>
