# Render Blueprint — Deploy M R S IPTV directly from GitHub
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mrs-iptv
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # NOTE: Persistent Disks require a paid Render instance (Starter+).
    # When upgrading from Free to Starter+, uncomment the disk block below and set DATA_DIR=/var/data
    # disk:
    #   name: mrs-iptv-data
    #   mountPath: /var/data
    #   sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: CLOUDFLARE_STRICT_ORIGIN
        value: "0"
      - key: DATA_DIR
        value: data
      - key: LIVECHECK_SCHEDULER
        value: "1"
      - key: CHECKOUT_CHALLENGE_REQUIRED
        value: "true"
      - key: CHECKOUT_POW_DIFFICULTY
        value: "10"
      - key: AUTO_REFILL_CODES
        value: "true"
      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: INGEST_KEY
        generateValue: true
      - key: SMS_WEBHOOK_SECRET
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
      - key: SECURITY_SECRET
        generateValue: true
      - key: INTERNAL_WEBHOOK_SECRET
        generateValue: true
      - key: CAMELLIA_TOKEN
        generateValue: true
      # Set these secret keys inside Render Dashboard -> Service -> Environment
      - key: CF_ORIGIN_SECRET
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: CSP_EXTRA_SCRIPT_HOSTS
        sync: false
      - key: CSP_EXTRA_FRAME_HOSTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: HCAPTCHA_SITE_KEY
        sync: false
      - key: HCAPTCHA_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Monetag-only ad & rewarded VIP defaults
      - key: ADS_TEST_MODE
        value: "true"
      - key: MONETAG_VERIFICATION_ID
        value: "fa9656182dbc7301dcd9a2326441dcf3"
      - key: MONETAG_VIGNETTE_ZONE_ID
        value: "11242067"
      - key: MONETAG_INTERSTITIAL_ZONE_ID
        value: "11242067"
      - key: MONETAG_POPUNDER_ZONE_ID
        value: "11226634"
      - key: MONETAG_SHOW_REGULAR_ADS
        value: "false"
      - key: MONETAG_BANNER_ENABLED
        value: "true"
      - key: MONETAG_STICKY_ENABLED
        value: "true"
      - key: MONETAG_POPUNDER_ENABLED
        value: "false"
      - key: MONETAG_INTERSTITIAL_ENABLED
        value: "false"
      - key: MONETAG_PUSH_ENABLED
        value: "false"
      - key: MONETAG_POPUNDER_COOLDOWN_MINUTES
        value: "30"
      - key: MONETAG_POPUNDER_MAX_PER_DAY
        value: "3"
      - key: MONETAG_INTERSTITIAL_COOLDOWN_SECONDS
        value: "180"
      - key: MONETAG_INTERSTITIAL_MAX_PER_DAY
        value: "12"
      - key: MONETAG_PUSH_DELAY_SECONDS
        value: "60"
      - key: MONETAG_PUSH_MIN_VISITS
        value: "2"
      - key: MONETAG_PUSH_DECLINE_DAYS
        value: "30"
      - key: MONETAG_EMPTY_SLOT_COLLAPSE_MS
        value: "4000"
      - key: MONETAG_REWARDED_ENABLED
        value: "false"
      - key: MONETAG_REWARDED_SHOW_FN
        sync: false
      - key: MONETAG_REWARDED_ZONE_ID
        sync: false
      - key: REWARD_UNLOCKS_VIP_CHANNELS
        value: "true"
      - key: REWARD_REQUIRE_POSTBACK
        value: "false"
      - key: MONETAG_POSTBACK_SECRET
        sync: false

